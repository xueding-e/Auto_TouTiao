# --- 淘汰类正则（纯快讯、无观点可写） ---
reject_patterns:
  - "^(今日|明日|本周|下周).*天气"
  - "^\\d+月\\d+日.*"
  - "^[A-Z]{2,}.*比分"
  - "^(发布|召开|举行|开幕|闭幕|出席|会见|致辞|签约|批复)"
  - "^(最新|刚刚).*(发布|通知|公告)"

