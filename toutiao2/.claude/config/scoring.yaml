# 点击吸引力评分配置
# 维度满分 100 = conflict(30) + emotion(25) + relevance(20) + info_gap(15) + extend(10)

# --- 各维度满分 ---
max_scores:
  conflict: 30
  emotion: 25
  relevance: 20
  info_gap: 15
  extend: 10

# --- 每命中一个关键词的分值 ---
per_keyword_points:
  conflict: 10
  emotion: 8
  relevance: 7
  info_gap: 8

# --- 标题相似度阈值（跨平台聚类） ---
similarity_threshold: 0.6

# --- 伪热度估算参数（无 TianAPI 数据时使用） ---
# estimated_hot = source_count * source_base + (100 - rank) * rank_base
hot_estimation:
  source_base: 500000
  rank_base: 10000

